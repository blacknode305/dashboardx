name: Open-source BYOK AI gateway checks
on:
  pull_request:
    paths:
      - 'ai-gateway/**'
      - 'client/js/module/AIGatewayAccess.js'
      - 'client/js/module/Widget/DashboardSettings.js'
      - 'client/js/module/Widget/WidgetLabViews.js'
      - 'client/_dashboardSettings.html'
      - 'tests/**'
      - 'LICENSE'
      - 'README.md'
      - '.github/workflows/owner-ai-tests.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All dependency-free tests
        run: node --test tests/*.test.js
      - name: Check syntax
        run: |
          node --check ai-gateway/server.js
          node --check client/js/module/AIGatewayAccess.js
          node --check client/js/module/Widget/DashboardSettings.js
          node --check client/js/module/Widget/WidgetLabViews.js
