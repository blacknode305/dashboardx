<!doctype html><html lang="ru"><body><template data-widget data-id="wishlistPrice" data-category="finance" data-title="Покупки · цели">
<section class="dx-experience dx-collection" data-collection="wishlistPrice">
<header class="dx-experience-head"><strong>Покупки · цели</strong><span class="dx-chip" data-role="count">0</span></header>
<form data-role="add-form" class="dx-form-grid" autocomplete="off"><label>Название<input name="name" type="text" required maxlength="120"  ></label>
<label>Цена цели<input name="target" type="number"  min="0" step="0.01" ></label>
<label>Уже накоплено<input name="saved" type="number"  min="0" step="0.01" ></label>
<label>Ссылка на товар<input name="link" type="url"   maxlength="2000"></label><button type="submit">＋ Добавить</button></form>
<div class="dx-experience-toolbar">
 <input type="search" data-role="search" placeholder="Найти в списке…" aria-label="Поиск по списку">
 <select data-role="filter" aria-label="Статус"></select>
 <button type="button" data-action="export">Экспорт JSON</button>
 <label class="dx-file-button">Импорт JSON<input data-role="import" type="file" accept=".json,application/json"></label>
</div>
<div data-role="results" class="dx-collection-results"></div>
<p class="dx-muted" data-role="message" aria-live="polite">Список сохраняется в браузере отдельно для этого виджета.</p>

</section></template></body></html>
