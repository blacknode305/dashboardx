<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>PRO-OPTIMA Suppliers</title></head><body>
<template data-widget data-id="optimaSuppliers" data-category="optima" data-title="Поставщики">
  <section class="optima-suppliers">
    <div class="optima-filters">
      <button type="button" data-role="optima-create-supplier" class="dx-add-supplier" title="Добавить поставщика" aria-label="Добавить поставщика">+</button>
      <input data-role="optima-search" type="search" autocomplete="off" data-i18n-placeholder="optima.search" placeholder="Поиск поставщика, контакта, телефона…">
      <select data-role="optima-branch" aria-label="Филиал" data-i18n-aria="optima.branch">
        <option value="" data-i18n="optima.allBranches">Все филиалы</option>
      </select>
      <select data-role="optima-order-day" aria-label="День заявки">
        <option value="">Любой день заявки</option>
      </select>
      <select data-role="optima-delivery-day" aria-label="День поставки">
        <option value="">Любой день поставки</option>
      </select>
    </div>
    <p data-role="optima-status" class="optima-status" role="status" aria-live="polite"></p>
    <div class="optima-summary" data-role="optima-count"></div>
    <div class="optima-supplier-list" data-role="optima-list"></div>
    <section class="optima-editor" data-role="optima-editor" hidden>
      <h3 data-role="optima-editor-title"></h3>
      <form data-role="optima-edit-form" autocomplete="off">
        <label><span data-i18n="optima.name">Название</span><input data-role="optima-edit-name" required maxlength="160"></label>
        <label><span data-i18n="optima.contact">Контакт</span><input data-role="optima-edit-contact"></label>
        <label><span data-i18n="optima.phone">Телефон</span><input data-role="optima-edit-phone"></label>
        <div data-role="optima-edit-schedules" hidden>
          <h4 data-i18n="optima.schedulesTitle">Графики</h4>
          <div data-role="optima-schedule-rows"></div>
          <button type="button" data-role="optima-add-schedule" data-i18n="optima.addSchedule">Добавить филиал</button>
        </div>
        <p class="optima-editor-error" data-role="optima-editor-error" aria-live="polite"></p>
        <div class="optima-editor-buttons">
          <button type="submit" data-role="optima-save-edit" data-i18n="optima.save">Сохранить</button>
          <button type="button" data-role="optima-cancel-edit" data-i18n="optima.cancel">Отмена</button>
        </div>
      </form>
    </section>
  </section>
</template></body></html>
