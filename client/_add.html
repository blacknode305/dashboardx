<!doctype html>
<html lang="ru">
<body>
<template data-widget data-id="add" data-category="system" data-title="Добавить виджет">
  <section class="widget-manager" aria-label="Управление виджетами">
    <div class="manager-section">
      <h3 class="manager-heading">Новый экземпляр</h3>
      <div class="manager-actions">
        <details class="dx-picker" data-role="type-picker">
          <summary aria-label="Выбрать тип нового виджета"><span data-role="type-label">Выбрать виджет</span><span class="dx-chevron" aria-hidden="true">⌄</span></summary>
          <div class="dx-picker-options" data-role="type-options"></div>
        </details>
        <button type="button" class="dx-primary" data-action="create-instance" disabled>Добавить</button>
      </div>
      <p class="manager-hint">Каждое добавление создаёт новый ID. Можно разместить несколько одинаковых виджетов.</p>
    </div>
    <div class="manager-section">
      <h3 class="manager-heading">Существующий экземпляр</h3>
      <div class="manager-actions">
        <details class="dx-picker" data-role="existing-picker">
          <summary aria-label="Выбрать существующий виджет"><span data-role="existing-label">Выбрать по ID</span><span class="dx-chevron" aria-hidden="true">⌄</span></summary>
          <div class="dx-picker-options" data-role="existing-options"></div>
        </details>
        <button type="button" data-action="link-instance" disabled>Показать</button>
      </div>
      <p class="manager-hint">Этот же ID будет виден на двух столах. Настройки расположения останутся отдельными.</p>
    </div>
    <div class="manager-section manager-section-last">
      <h3 class="manager-heading">На этом рабочем столе <span data-role="instance-count" class="manager-count">0</span></h3>
      <div class="manager-instances" data-role="instances-list"></div>
    </div>
  </section>
</template>
</body>
</html>
