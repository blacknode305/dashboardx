<!doctype html>
<html lang="ru"><body>
<template data-widget data-id="add" data-category="system" data-title="Управление виджетами">
  <div class="widget-manager">
    <div class="manager-section">
      <label class="manager-label" for="widget-type">Создать новый экземпляр</label>
      <div class="manager-row">
        <select data-role="widget-type" aria-label="Тип нового виджета"></select>
        <button type="button" data-action="create-instance">+ Создать</button>
      </div>
      <small>Новый виджет получит уникальный ID и независимые настройки.</small>
    </div>
    <div class="manager-section">
      <label class="manager-label" for="existing-widget">Показать существующий виджет</label>
      <div class="manager-row">
        <select data-role="existing-widget" aria-label="Экземпляр с другого рабочего стола"></select>
        <button type="button" data-action="link-instance">Показать здесь</button>
      </div>
      <small>Один ID на разных рабочих столах означает один и тот же экземпляр.</small>
    </div>
    <div class="manager-section">
      <strong class="manager-label">Виджеты этого стола</strong>
      <div data-role="instances-list" class="manager-instances"></div>
    </div>
    <p data-role="manager-message" class="manager-message" aria-live="polite"></p>
  </div>
</template>
</body></html>
