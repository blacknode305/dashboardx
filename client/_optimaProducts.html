<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Наименования</title></head><body>
<template data-widget data-id="optimaProducts" data-category="optima" data-title="Наименования">
<section class="optima-data" data-optima-module="optimaProducts">
  <div class="optima-data-filters">
    <div class="dx-product-search"><button type="button" data-role="product-add" title="Добавить наименование" aria-label="Добавить наименование">+</button><input type="search" data-role="data-search" data-i18n-placeholder="optima.searchSimple" placeholder="Поиск…"></div>
    <select data-role="data-branch" data-i18n-aria="optima.branch" aria-label="Филиал"></select>
    <div class="dx-product-supplier-picker">
      <input type="search" data-role="data-supplier-query" aria-label="Поиск поставщика в списке" placeholder="Найти поставщика…" autocomplete="off" spellcheck="false">
      <select data-role="data-extra" data-i18n-aria="optima.supplier" aria-label="Выбрать поставщика"></select>
    </div>
    <input type="date" data-role="data-date" data-i18n-aria="optima.date" aria-label="Дата">
    <select data-role="data-mode" data-i18n-aria="optima.mode" aria-label="Режим"></select>
  </div>
  <p class="optima-status" data-role="data-status-text" aria-live="polite"></p>
  <p class="optima-summary" data-role="data-summary"></p>
  <section class="dx-product-draft" data-role="product-draft" hidden>
    <form data-role="product-draft-form">
      <div class="dx-product-draft-head"><strong data-role="product-draft-title">Добавить наименование</strong><span>Справочник сырья</span></div>
      <div class="dx-product-fields">
        <label class="dx-wide">Наименование сырья<input name="name" required autocomplete="off" placeholder="Наименование сырья"></label>
        <label class="dx-wide">Единица измерения<input name="unit" placeholder="шт, кг, л"></label>
      </div>
      <fieldset class="dx-product-branches"><legend>Не использовать на производствах</legend><div data-role="product-draft-branches"></div></fieldset>
      <div class="dx-product-fields">
        <label class="dx-wide">Примечание<textarea name="note" rows="2"></textarea></label>
      </div>
      <p class="dx-product-draft-info" data-role="product-draft-info">Новое наименование будет добавлено в рабочий справочник сырья. Товар поставщика можно будет привязать отдельно.</p>
      <div class="dx-product-draft-actions"><button type="button" data-role="product-draft-cancel">Отмена</button><button type="submit" data-role="product-draft-save">Сохранить</button></div>
    </form>
  </section>
  <div class="optima-table-scroll" data-role="data-results"></div>
</section>
</template></body></html>
