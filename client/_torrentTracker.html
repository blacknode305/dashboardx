<!doctype html><html lang="ru"><body><template data-widget data-id="torrentTracker" data-category="tools" data-title="Магнет-ссылки · локальный список">
<section class="dx-experience dx-collection" data-collection="torrentTracker">
<header class="dx-experience-head"><strong>Магнет-ссылки · локальный список</strong><span class="dx-chip" data-role="count">0</span></header>
<form data-role="add-form" class="dx-form-grid" autocomplete="off"><label>Название раздачи<input name="name" type="text" required maxlength="120"  ></label>
<label>Magnet или HTTPS-ссылка<input name="link" type="text"   maxlength="2000"></label><button type="submit">＋ Добавить</button></form>
<div class="dx-experience-toolbar">
 <input type="search" data-role="search" placeholder="Найти в списке…" aria-label="Поиск по списку">
 <select data-role="filter" aria-label="Статус"></select>
 <button type="button" data-action="export">Экспорт JSON</button>
 <label class="dx-file-button">Импорт JSON<input data-role="import" type="file" accept=".json,application/json"></label>
</div>
<div data-role="results" class="dx-collection-results"></div>
<p class="dx-muted" data-role="message" aria-live="polite">Список сохраняется в браузере отдельно для этого виджета.</p>
<p class="dx-muted">Magnet-ссылки открываются во внешнем торрент-клиенте. Загрузку и прогресс браузер не отслеживает.</p>
</section></template></body></html>
