<!doctype html><html lang="ru"><body>
<template data-widget data-id="nesEmulator" data-category="games" data-title="NES Emulator">
<section class="dx-experience dx-nes" tabindex="-1">
 <header class="dx-experience-head">
  <div><strong>NES · Retro Console</strong><small data-role="game-name">Нет загруженной игры</small></div>
  <span class="dx-chip" data-role="game-status" aria-live="polite">Выберите файл .nes</span>
 </header>
 <div class="dx-nes-topline"><span class="dx-nes-active" data-role="nes-active">○ ГОТОВНОСТЬ</span><span>F5 — SAVE · F9 — LOAD</span></div>
 <div class="dx-nes-screen" data-role="screen" tabindex="0" aria-label="Экран NES. Перетащите сюда ROM .nes или выберите файл">
  <canvas width="256" height="240" aria-label="Видеовыход NES"></canvas>
 </div>
 <div class="dx-experience-toolbar">
  <label class="dx-file-button">Загрузить ROM<input type="file" accept=".nes,application/octet-stream" data-role="romLoader" aria-label="Выбрать игру NES"></label>
  <button type="button" data-action="nes-focus">⌨ Управление</button>
  <button type="button" data-action="nes-quickstart">▶ Играть / ROM</button>
  <button type="button" data-action="pause" disabled>⏸ Пауза · P</button>
  <button type="button" data-action="reset" disabled>↻ Reset · R</button>
  <button type="button" data-action="mute">🔊 Звук · M</button>
  <button type="button" data-action="fullscreen">⛶ Экран</button>
  <label>Скорость <select data-role="nes-speed"><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="1.5">1,5×</option><option value="2">2×</option></select></label>
  <label class="dx-nes-toggle"><input type="checkbox" data-role="nes-scanlines"> CRT-линии</label>
 </div>
 <div class="dx-experience-toolbar">
  <button type="button" data-action="save" disabled>Сохранить · F5</button>
  <button type="button" data-action="load" disabled>Загрузить · F9</button>
  <button type="button" data-action="export" disabled>Экспорт save</button>
  <label class="dx-file-button">Импорт save<input type="file" accept=".json,application/json" data-role="saveLoader"></label>
 </div>
 <div class="dx-nes-pad" data-role="controls" aria-label="Экранный геймпад">
  <div class="dx-nes-dpad">
   <button type="button" data-nes="ArrowUp" class="up" aria-label="Вверх">▲</button>
   <button type="button" data-nes="ArrowLeft" class="left" aria-label="Влево">◀</button>
   <button type="button" data-nes="ArrowRight" class="right" aria-label="Вправо">▶</button>
   <button type="button" data-nes="ArrowDown" class="down" aria-label="Вниз">▼</button>
  </div>
  <div class="dx-nes-actions">
   <button type="button" data-nes="KeyX">B</button>
   <button type="button" data-nes="KeyZ">A</button>
   <button type="button" data-nes="ShiftRight" class="small">SELECT</button>
   <button type="button" data-nes="Enter" class="small">START</button>
  </div>
 </div>
 <details class="dx-experience-help">
  <summary>Настроить клавиши</summary>
  <p>Нажмите на действие, затем на новую клавишу. Настройки сохраняются для этого экземпляра NES.</p>
  <div class="dx-nes-keymap" data-role="nes-mapping"></div>
  <button type="button" data-action="nes-controls-reset">Сбросить управление</button>
 </details>
 <details class="dx-experience-help">
  <summary>Клавиши и управление</summary>
  <p>Стрелки или WASD — движение · Z/J — A · X/K — B · Enter — Start · Shift — Select.</p>
  <p>На Mac функциональные F5/F9 могут управлять системой — при необходимости используйте кнопки Save/Load в виджете.</p>
  <p>P — пауза · R — сброс · M — звук · F5 — сохранение · F9 — загрузка. Поддерживается геймпад Gamepad API.</p>
  <p>Клавиши действуют только когда активно окно NES; остальные поля DashboardX не перехватываются. ROM .nes можно перетащить на экран. Скорость: 0,5–2×.</p><p>Используйте только ROM-файлы, распространяемые законно.</p>
 </details>
</section>
</template></body></html>
