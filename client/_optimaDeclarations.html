<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Декларации</title></head><body>
<template data-widget data-id="optimaDeclarations" data-category="optima" data-title="Декларации">
<section class="dx-declarations">
  <div class="dx-declarations-main" data-role="declaration-main">
  <div class="dx-declarations-tabs">
    <div class="dx-declarations-tab-group" role="group" aria-label="Типы документов">
      <button type="button" data-role="declaration-type-tab" data-type="all" aria-pressed="true">Все</button>
      <button type="button" data-role="declaration-type-tab" data-type="eaeu" aria-pressed="false">ЕАЭС</button>
      <button type="button" data-role="declaration-type-tab" data-type="veterinary" aria-pressed="false">Ветсправки</button>
      <button type="button" data-role="declaration-type-tab" data-type="certificate" aria-pressed="false">Сертификаты</button>
      <button type="button" data-role="declaration-type-tab" data-type="specification" aria-pressed="false">Спецификации</button>
      <button type="button" data-role="declaration-type-tab" data-type="archive" aria-pressed="false">Архив</button>
    </div>
    <button type="button" class="dx-decl-import-trigger" data-role="declaration-import-trigger" title="Импортировать фотографии и реквизиты из подготовленного пакета">Импорт</button>
    <input type="file" data-role="declaration-import-file" accept=".json,application/json" hidden>
  </div>
  <section class="dx-decl-import-review" data-role="declaration-import-review" hidden aria-label="Предварительная проверка документов">
    <div class="dx-decl-import-head"><strong>Проверка распознанных документов</strong><button type="button" data-role="declaration-import-cancel" aria-label="Отмена">×</button></div>
    <p data-role="declaration-import-message">Проверьте реквизиты перед загрузкой. Документы сохранятся с пометкой «На проверке».</p>
    <div data-role="declaration-import-items" class="dx-decl-import-items"></div>
    <button type="button" data-role="declaration-import-confirm">Импортировать черновики</button>
  </section>
  <section class="dx-decl-archive-panel" data-role="declaration-archive-panel" hidden>
    <div class="dx-decl-import-head">
      <strong data-role="declaration-archive-title">Перенести документ в архив</strong>
      <button type="button" data-role="declaration-archive-cancel" title="Закрыть" aria-label="Отмена">×</button>
    </div>
    <label>Причина
      <select data-role="declaration-archive-reason">
        <option value="expired">Истёк срок действия</option>
        <option value="replaced">Получен новый документ</option>
        <option value="other">Другая причина</option>
      </select>
    </label>
    <label>Примечание (необязательно)
      <textarea data-role="declaration-archive-note" rows="2" maxlength="300" placeholder="Например, запросили новый сертификат 07.11.2026"></textarea>
    </label>
    <div class="dx-decl-archive-actions">
      <button type="button" data-role="declaration-archive-confirm">Сохранить в архив</button>
      <button type="button" data-role="declaration-archive-cancel-secondary">Отмена</button>
    </div>
    <small>Номер, сроки, связанные фотографии и история запроса останутся в базе. Из рабочего списка запись исчезнет.</small>
  </section>
  <div class="dx-declarations-filters">
    <div class="dx-declarations-search">
      <button type="button" data-role="declaration-add" title="Добавить документ" aria-label="Добавить документ">+</button>
      <input type="search" data-role="declaration-search" autocomplete="off" placeholder="Поиск продукции, организации или номера…" aria-label="Поиск документов">
    </div>
    <div class="dx-declarations-supplier" data-role="declaration-supplier-picker">
      <input type="search" data-role="declaration-supplier-query" role="combobox" aria-autocomplete="list" aria-haspopup="listbox" aria-expanded="false" aria-label="Фильтр по поставщику" placeholder="Все поставщики" autocomplete="off" spellcheck="false">
      <div data-role="declaration-supplier-list" role="listbox" aria-label="Список поставщиков" hidden></div>
    </div>
    <select data-role="declaration-status-filter" aria-label="Состояние документа">
      <option value="all">Все сроки</option>
      <option value="expired">Просрочены</option>
      <option value="urgent">До 7 дней</option>
      <option value="soon">До 30 дней</option>
      <option value="valid">Действуют</option>
      <option value="upcoming">Ещё не действуют</option>
      <option value="needs_review">На проверке</option>
      <option value="confirmed">Проверенные вручную</option>
      <option value="replacement_requested">Запрошен новый документ</option>
    </select>
  </div>
  <p class="optima-status" data-role="declaration-status-text" aria-live="polite"></p>
  <div class="dx-declarations-counts" data-role="declaration-counts"></div>
  <div class="dx-declarations-scroll" data-role="declaration-list"></div>
  </div>
  <aside class="dx-decl-files-viewer dx-decl-floating-viewer" data-role="declaration-files-viewer" role="dialog" aria-modal="false" tabindex="-1" aria-label="Просмотр оригинала документа (не блокирует рабочий стол)" hidden>
    <header class="dx-decl-viewer-header" data-role="declaration-files-drag-handle" title="Перетащить окно просмотра">
      <div class="dx-decl-viewer-heading">
        <strong data-role="declaration-files-title">Оригинал документа</strong>
        <small data-role="declaration-files-counter"></small>
      </div>
      <button type="button" class="dx-decl-viewer-close" data-role="declaration-files-close" title="Закрыть оригинал" aria-label="Закрыть оригинал">×</button>
    </header>
    <div class="dx-decl-files-toolbar" role="toolbar" aria-label="Управление просмотром">
      <button type="button" data-role="declaration-files-prev" title="Предыдущая страница" aria-label="Предыдущее фото">‹</button>
      <button type="button" data-role="declaration-files-next" title="Следующая страница" aria-label="Следующее фото">›</button>
      <button type="button" class="dx-decl-files-fit" data-role="declaration-files-fit" title="Вписать целиком">Вписать</button>
      <button type="button" data-role="declaration-files-zoom-out" title="Уменьшить" aria-label="Уменьшить">−</button>
      <output data-role="declaration-files-zoom-value" aria-live="polite">100%</output>
      <button type="button" data-role="declaration-files-zoom-in" title="Увеличить" aria-label="Увеличить">+</button>
      <button type="button" class="dx-decl-files-actual" data-role="declaration-files-actual" title="Исходное разрешение: один пиксель фотографии на один пиксель экрана">1:1</button>
    </div>
    <div class="dx-decl-files-stage" data-role="declaration-files-grid" tabindex="0" aria-label="Область просмотра оригинала"></div>
    <div class="dx-decl-viewer-footer">
      <span data-role="declaration-files-filename"></span>
      <a data-role="declaration-files-download" href="#" download hidden>Скачать оригинал</a>
    </div>
  </aside>
</section>
</template></body></html>
