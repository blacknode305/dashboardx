<!doctype html><html lang="ru"><body><template data-widget data-id="videoPlayer" data-category="media" data-title="videoPlayer"><section class="dx-experience dx-media" data-kind="video">
 <header class="dx-experience-head"><strong>Видеоплеер</strong><span class="dx-chip" data-role="state">Видео не выбрано</span></header>
 <video controls playsinline preload="metadata" data-role="player"></video>
 <div class="dx-experience-toolbar">
  <label class="dx-file-button">Загрузить видео<input data-role="files" type="file" accept="video/*,.mp4,.webm,.mov,.m4v"></label>
  <input type="url" data-role="url" placeholder="HTTPS-ссылка на видео" aria-label="URL видео">
  <button type="button" data-action="add-url">Открыть URL</button>
 </div>
 <div class="dx-experience-toolbar">
  <button type="button" data-action="play">▶ Пуск / пауза</button>
  <button type="button" data-action="back">−10с</button>
  <button type="button" data-action="forward">+10с</button>
  <button type="button" data-action="pip">В отдельном окне</button>
  <button type="button" data-action="fullscreen">⛶ Весь экран</button>
  <label>Скорость <select data-role="speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
 </div>
 <p class="dx-muted" data-role="now">Локальный файл или прямая HTTPS-ссылка на медиа (не ссылка на страницу видеохостинга).</p>
 <p class="dx-muted">Пробел — пуск/пауза · ← / → — 10 секунд · F — полноэкранный режим, когда активно окно видео.</p>
 </section></template></body></html>
