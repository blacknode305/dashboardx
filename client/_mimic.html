<!doctype html><html lang="ru"><body>
<template data-widget data-id="mimic" data-category="learning" data-title="Мимика">
<section class="dx-study dx-mimic" data-course="mimic" aria-label="Мимика — наблюдение за движениями лица">
  <header class="dx-study-head">
    <div><small>МИМИКА · НЕВЕРБАЛЬНОЕ ОБЩЕНИЕ</small><h2>Мимика</h2>
      <p>Движения лица · FACS · наблюдение · контекст</p></div>
    <div class="dx-study-progress"><strong data-role="course-percent">0%</strong>
      <span data-role="course-progress">0 из 28 уроков</span><div class="dx-study-track">
        <div data-role="course-progress-bar"></div></div></div>
  </header>
  <nav class="dx-study-tabs" aria-label="Разделы изучения мимики">
    <button type="button" data-course-tab="course" aria-pressed="true">Курс мимики</button>
    <button type="button" data-course-tab="lab" aria-pressed="false">Атлас движений</button>
    <button type="button" data-course-tab="observations" aria-pressed="false">Тренажёр</button>
    <button type="button" data-course-tab="review" aria-pressed="false">Повторение</button>
    <button type="button" data-course-tab="sources" aria-pressed="false">Материалы</button>
  </nav>
  <div class="dx-study-layout">
    <aside class="dx-study-sidebar" aria-label="Главы курса мимики">
      <input type="search" data-role="course-search" placeholder="Найти движение, AU или тему…" autocomplete="off" aria-label="Поиск урока мимики">
      <div data-role="course-chapters" class="dx-study-chapters"></div>
    </aside>
    <main class="dx-study-main" data-role="course-main" tabindex="-1"></main>
  </div>
</section>
</template></body></html>
