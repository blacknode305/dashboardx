<!doctype html><html lang="ru"><body>
<template data-widget data-id="binanceApi" data-category="finance" data-title="Binance Crypto">
<section class="dx-experience dx-crypto">
 <header class="dx-experience-head"><strong>Криптовалюты · Binance</strong><span class="dx-chip" data-role="status">Обновление…</span></header>
 <div class="dx-experience-toolbar">
  <label>Пара<select data-role="pair">
   <option value="BTCUSDT">BTC / USDT</option><option value="ETHUSDT">ETH / USDT</option>
   <option value="SOLUSDT">SOL / USDT</option><option value="BNBUSDT">BNB / USDT</option>
   <option value="XRPUSDT">XRP / USDT</option><option value="ADAUSDT">ADA / USDT</option>
  </select></label>
  <label>Период<select data-role="interval">
   <option value="1m">1 мин</option><option value="5m">5 мин</option><option value="15m">15 мин</option>
   <option value="1h">1 час</option><option value="4h">4 часа</option><option value="1d">1 день</option>
   <option value="1w">1 неделя</option>
  </select></label>
  <button type="button" data-action="refresh">↻ Обновить</button>
 </div>
 <div class="dx-crypto-price">
  <strong data-role="price">—</strong>
  <span data-role="change">—</span>
 </div>
 <div data-role="stats" class="dx-crypto-stats"></div>
 <div class="dx-crypto-chart"><canvas height="180" aria-label="График криптовалюты"></canvas></div>
 <p class="dx-muted">Публичные котировки. Задержки API и ограничения региона возможны. Финансовой рекомендацией не является.</p>
</section></template></body></html>
