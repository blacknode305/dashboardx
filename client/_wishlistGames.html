<!doctype html><html lang="ru"><body><template data-widget data-id="wishlistGames" data-category="tools" data-title="Игры · список желаний">
<section class="dx-experience dx-collection" data-collection="wishlistGames">
<header class="dx-experience-head"><strong>Игры · список желаний</strong><span class="dx-chip" data-role="count">0</span></header>
<form data-role="add-form" class="dx-form-grid" autocomplete="off"><label>Название игры<input name="name" type="text" required maxlength="120"  ></label>
<label>Платформа<input name="platform" type="text"   ></label>
<label>Ссылка на игру<input name="link" type="url"   maxlength="2000"></label><button type="submit">＋ Добавить</button></form>
<div class="dx-experience-toolbar">
 <input type="search" data-role="search" placeholder="Найти в списке…" aria-label="Поиск по списку">
 <select data-role="filter" aria-label="Статус"></select>
 <button type="button" data-action="export">Экспорт JSON</button>
 <label class="dx-file-button">Импорт JSON<input data-role="import" type="file" accept=".json,application/json"></label>
</div>
<div data-role="results" class="dx-collection-results"></div>
<p class="dx-muted" data-role="message" aria-live="polite">Список сохраняется в браузере отдельно для этого виджета.</p>

</section></template></body></html>
