<!doctype html><html lang="ru"><body><template data-widget data-id="audioPlayer" data-category="media" data-title="audioPlayer"><section class="dx-experience dx-media" data-kind="audio">
 <header class="dx-experience-head"><strong>Музыкальный плеер</strong><span class="dx-chip" data-role="state">Плейлист пуст</span></header>
 <div data-role="now" class="dx-now-playing">Выберите аудиофайлы или добавьте ссылку</div>
 <audio data-role="player" preload="metadata"></audio>
 <div class="dx-experience-toolbar">
  <button type="button" data-action="prev" title="Предыдущий трек">⏮</button>
  <button type="button" data-action="play" title="Воспроизвести / пауза">▶</button>
  <button type="button" data-action="next" title="Следующий трек">⏭</button>
  <button type="button" data-action="loop" title="Повтор">↻</button>
  <label>Громкость <input type="range" data-role="volume" min="0" max="100" value="70"></label>
 </div>
 <div class="dx-experience-toolbar"><input type="range" min="0" max="1000" value="0" data-role="seek" aria-label="Прогресс трека"><span data-role="clock">00:00 / 00:00</span></div>
 <div class="dx-experience-toolbar">
  <label class="dx-file-button">＋ Файлы<input type="file" data-role="files" accept="audio/*,.mp3,.ogg,.wav,.flac,.m4a" multiple></label>
  <input type="url" data-role="url" placeholder="HTTPS-ссылка на аудио" aria-label="Ссылка на аудио">
  <button type="button" data-action="add-url">＋ URL</button>
  <button type="button" data-action="clear">Очистить</button>
 </div>
 <div data-role="playlist" class="dx-media-playlist"></div>
 <details class="dx-radio-section"><summary>📻 Радиостанции · Railway</summary>
 <div class="dx-experience-toolbar"><input type="url" data-role="radio-api" placeholder="HTTPS-адрес Radio API на Railway" aria-label="Radio API"></div>
 <div class="dx-experience-toolbar"><input type="password" data-role="radio-token" placeholder="Токен Radio API" aria-label="Токен Radio API" autocomplete="off"><button type="button" data-action="radio-load">↻ Обновить</button></div>
 <div class="dx-experience-toolbar"><input type="text" data-role="radio-name" maxlength="120" placeholder="Название радиостанции"></div>
 <div class="dx-experience-toolbar"><input type="url" data-role="radio-url" placeholder="Прямая ссылка на радиопоток"><button type="button" data-action="radio-add">＋ Сохранить</button></div>
 <div data-role="radio-list" class="dx-media-playlist"></div>
 <p class="dx-muted">Станции сохраняются на Railway. Токен хранится только в текущей сессии браузера. Для воспроизведения нужен доступный аудиопоток.</p>
 </details>
 <p class="dx-muted">Файлы воспроизводятся локально, не загружаются на сервер. HTTPS-ссылки сохраняются между запусками. Пробел — пауза при активном окне.</p>
 </section></template></body></html>
