<!doctype html><html lang="ru"><body><template data-widget data-id="datetime" data-category="system" data-title="Дата и время">
<section class="dx-experience dx-worldclock">
 <header class="dx-experience-head"><strong>Мировые часы</strong><span class="dx-chip" data-role="tz-name">Локальное время</span></header>
 <div class="dx-worldclock-time" data-role="time">--:--:--</div>
 <div class="dx-worldclock-date" data-role="date">—</div>
 <div class="dx-experience-toolbar">
  <label>Часовой пояс
   <select data-role="timezone">
    <option value="local">Системный</option><option value="Asia/Almaty">Казахстан · Алматы</option>
    <option value="Europe/Moscow">Москва</option><option value="Europe/London">Лондон</option>
    <option value="America/New_York">Нью-Йорк</option><option value="Asia/Tokyo">Токио</option>
    <option value="UTC">UTC</option>
   </select>
  </label>
  <label>Формат<select data-role="format"><option value="24">24 часа</option><option value="12">12 часов</option></select></label>
  <button type="button" data-action="copy-time">Копировать</button>
 </div>
</section></template></body></html>
