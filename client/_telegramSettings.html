<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Telegram Settings</title></head><body>
<template data-widget data-id="telegramSettings" data-category="telegram" data-title="Telegram settings">
  <section class="telegram-settings">
    <div class="tg-settings-heading">
      <span class="tg-settings-icon" aria-hidden="true">✈</span>
      <strong data-i18n="widget.telegramSettings">Настройки Telegram</strong>
    </div>
    <form data-role="telegram-form" class="tg-settings-form" autocomplete="off">
      <label for="telegram-bot-token" data-i18n="tg.tokenLabel">Token TelegramApi</label>
      <div class="tg-token-row">
        <input type="password" data-role="telegram-token" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Вставьте токен бота" data-i18n-placeholder="tg.placeholder" required>
        <button type="button" data-role="telegram-reveal" data-i18n="tg.show">Показать</button>
      </div>
      <div class="tg-settings-actions">
        <button type="submit" data-i18n="tg.apply">Применить в этой вкладке</button>
        <button type="button" data-role="telegram-clear" data-i18n="tg.clear">Удалить токен</button>
      </div>
    </form>
    <p class="tg-settings-status" data-role="telegram-status" role="status" aria-live="polite" data-i18n="tg.cleared">Токен не задан.</p>
    <p class="tg-settings-notice" data-i18n="tg.notice">Токен хранится только в памяти этой вкладки и исчезает при перезагрузке. Для безопасных запросов Telegram нужен сервер.</p>
  </section>
</template>
</body></html>
