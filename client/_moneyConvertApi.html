<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>DashboardX currency widget</title></head>
<body>
<template data-widget data-id="moneyConvertApi" data-category="finance" data-title="Exchange rates">
  <section class="fx-widget" aria-label="MoneyConvert">
    <form class="fx-form" data-role="fx-form" autocomplete="off">
      <div class="fx-field" data-role="fx-field-from">
        <label class="fx-label" data-i18n="fx.from">Исходная валюта</label>
        <input type="text" class="fx-search-input" data-role="fx-input-from"
          role="combobox" aria-autocomplete="list" aria-expanded="false"
          data-i18n-placeholder="fx.searchFrom" placeholder="Поиск: USD, EUR..." spellcheck="false"
          autocapitalize="characters" autocomplete="off" maxlength="24">
        <div class="fx-suggestions" data-role="fx-suggestions-from" role="listbox" hidden></div>
      </div>
      <div class="fx-field" data-role="fx-field-to">
        <label class="fx-label" data-i18n="fx.to">В какую валюту</label>
        <input type="text" class="fx-search-input" data-role="fx-input-to"
          role="combobox" aria-autocomplete="list" aria-expanded="false"
          data-i18n-placeholder="fx.searchTo" placeholder="Поиск: KZT, RUB..." spellcheck="false"
          autocapitalize="characters" autocomplete="off" maxlength="24">
        <div class="fx-suggestions" data-role="fx-suggestions-to" role="listbox" hidden></div>
      </div>
      <div class="fx-add-row">
        <button class="fx-add-button" type="submit" data-role="fx-add" data-i18n="fx.add" disabled>Добавить пару</button>
        <button class="fx-refresh-button" type="button" data-role="fx-refresh" data-i18n-title="fx.refresh" data-i18n-aria="fx.refresh" title="Обновить курсы">↻</button>
      </div>
    </form>
    <p class="fx-status" role="status" aria-live="polite" data-role="fx-status" data-i18n="fx.loading">Загрузка доступных валют…</p>
    <div class="fx-results">
      <div class="fx-section-head">
        <strong data-i18n="fx.savedPairs">Добавленные пары</strong>
        <span data-role="fx-count" class="fx-count">0</span>
      </div>
      <div class="fx-pairs" data-role="fx-pairs"></div>
    </div>
    <footer class="fx-attribution">
      <a href="https://www.moneyconvert.net/api/" target="_blank" rel="noopener noreferrer">MoneyConvert.net</a>
      <span data-i18n="fx.disclaimer">Справочные курсы, не для торговых операций</span>
    </footer>
  </section>
</template>
</body>
</html>
