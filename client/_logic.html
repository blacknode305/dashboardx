<!doctype html><html lang="ru"><body>
<template data-widget data-id="logic" data-category="learning" data-title="Логика">
<section class="dx-study" data-course="logic" aria-label="Курс логики и критического мышления">
  <header class="dx-study-head">
    <div><small>МЫШЛЕНИЕ · АРГУМЕНТАЦИЯ</small><h2>Логика</h2><p>Выводы, доказательства, символы, заблуждения</p></div>
    <div class="dx-study-progress"><strong data-role="course-percent">0%</strong><span data-role="course-progress">0 из 32</span><div class="dx-study-track"><div data-role="course-progress-bar"></div></div></div>
  </header>
  <nav class="dx-study-tabs" aria-label="Разделы курса логики">
    <button type="button" data-course-tab="course" aria-pressed="true">Курс логики</button>
    <button type="button" data-course-tab="practice" aria-pressed="false">Задачи</button>
    <button type="button" data-course-tab="review" aria-pressed="false">Повторение</button>
    <button type="button" data-course-tab="articles" aria-pressed="false">Статьи из интернета</button>
    <button type="button" data-course-tab="sources" aria-pressed="false">Материалы</button>
  </nav>
  <div class="dx-study-layout">
    <aside class="dx-study-sidebar" aria-label="Главы логики">
      <input type="search" data-role="course-search" placeholder="Найти правило или задачу…" autocomplete="off" aria-label="Поиск урока">
      <div data-role="course-chapters" class="dx-study-chapters"></div>
    </aside>
    <main class="dx-study-main" data-role="course-main" tabindex="-1"></main>
  </div>
</section>
</template></body></html>
